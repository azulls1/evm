<desc id="ciclo-hibrido-desc">Arriba, el marco clásico del PMBOK®: línea base (BAC $115 000, 6 meses), control de cambios (5.7) y cortes de valor ganado en el mes 3 (CPI 0,734, SPI 0,788: escalar y corregir) y en el mes 5 (CPI 0,929, SPI 0,989). Abajo, la ejecución ágil en iteraciones de 2 semanas: backlog priorizado, iteración, revisión con el cliente y retrospectiva. Lo aceptado en la revisión es el avance real con el que se calcula el EV, y las acciones correctivas del corte entran al backlog. Al pie, las 12 iteraciones con el avance real y el planificado de cada mes.</desc>
