<title id="linea-tiempo-title">Los seis meses del proyecto</title>
<desc id="linea-tiempo-desc">Línea de tiempo de seis meses: línea base de $115 000; corte del mes 3 con CPI 0,734 y SPI 0,788 que lleva a medidas correctivas; meses 4 y 5 con CPI 1,206 y SPI 1,268 del periodo; corte del mes 5 con CPI 0,929 y SPI 0,989; y cierre previsto con EAC de $122 000 en unos 6,07 meses.</desc>
