  --font-sans: 'DM Sans', system-ui, sans-serif;
  --font-title: 'Sora', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace; }
      #linea-tiempo-root { font-family: var(--font-sans); color: var(--color-ink); }
