</div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Aguja oscura: índice acumulado (CPI = EV ÷ AC, SPI = EV ÷ PV)</span><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Aguja azul: índice solo de los meses 4 y 5</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Cuña roja: umbral de 0,90 (tolerancia del 10 %)</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Palancas 1, 2 y 3: las tres estrategias de control</span></span><span class="iso-caption">Tema 5, apartado 5.8: medir, comparar con la línea base, actuar y volver a medir. En el corte del mes 3 el CPI es 0,734 y el SPI 0,788: los desvíos (26,6 % y 21,2 %) superan con holgura un umbral típico del 10 %, así que se activan tres estrategias: acciones correctivas con umbrales de escalada y reuniones de estado (5.8), control de cambios de alcance (5.7) y recursos y paquetes pequeños en un enfoque híbrido con iteraciones ágiles (Temas 2 y 4, 5.8). Medidos solo los meses 4 y 5, se ganaron $49 450 de trabajo gastando $41 000 frente a un plan de $39 000: CPI 1,206 y SPI 1,268. Eso lleva el acumulado del mes 5 a CPI 0,929 y SPI 0,989, dentro de la tolerancia, y baja el EAC de $130 450 a $122 000.</span></figcaption></figure>
